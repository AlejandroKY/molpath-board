server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cabeceras de seguridad. connect-src limita a qué APIs puede hablar la interfaz.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://localhost:8080 https://eutils.ncbi.nlm.nih.gov https://civicdb.org https://reactome.org; frame-ancestors 'none'; base-uri 'self'" always;

  location / {
    try_files $uri $uri/ /index.html;
  }
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
